{% extends "base.html" %}

{% block title %}Sign In — SentinelFlow NIDS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
  <div class="card-sentinel p-8 space-y-6 bg-white shadow-lg">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-400 flex items-center justify-center text-white mx-auto shadow-md">
        <i data-lucide="shield-check" class="w-6 h-6"></i>
      </div>
      <h2 class="font-display font-bold text-2xl text-[#3B2F2A]">Sign In to SentinelFlow</h2>
      <p class="text-xs text-[#8A7568]">Role-based access control for security operations</p>
    </div>

    <!-- Quick Demo Role Switcher -->
    <div class="p-3 rounded-xl bg-[#FFF8F0] border border-[#F3E5D8] space-y-2 text-center">
      <span class="text-[11px] font-bold text-orange-600 uppercase tracking-wider block">Quick Evaluator Sign-In:</span>
      <div class="flex items-center justify-center gap-2">
        <a href="/auth/demo-login/admin" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-orange-100 text-orange-800 hover:bg-orange-200">Admin</a>
        <a href="/auth/demo-login/analyst" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-100 text-amber-800 hover:bg-amber-200">Analyst</a>
        <a href="/auth/demo-login/viewer" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-stone-100 text-stone-800 hover:bg-stone-200">Viewer</a>
      </div>
    </div>

    <!-- Credentials Form -->
    <form method="POST" action="/auth/login" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-[#3B2F2A] block mb-1">Username</label>
        <input type="text" name="username" required placeholder="admin" class="w-full text-xs py-2 px-3 rounded-xl border border-[#F3E5D8] bg-white focus:outline-none focus:border-orange-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-[#3B2F2A] block mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full text-xs py-2 px-3 rounded-xl border border-[#F3E5D8] bg-white focus:outline-none focus:border-orange-500">
      </div>

      <button type="submit" class="btn-primary-gradient w-full py-2.5 text-xs justify-center shadow-md">
        Sign In to Sensor
      </button>
    </form>

    <div class="text-center text-xs text-[#8A7568]">
      <span>New operator? </span>
      <a href="/auth/register" class="text-orange-600 font-semibold hover:underline">Register account</a>
    </div>

  </div>
</div>
{% endblock %}
